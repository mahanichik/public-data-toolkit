name: Run data worker
on:
  workflow_dispatch:
    inputs:
      source:
        required: true
        type: choice
        options: [overture_places, gdelt_events, overpass_places, greenhouse_jobs, lever_jobs, ashby_jobs, crawlee_site, scrapling_page, jobspy_jobs, searxng_search, tech_detect, contact_extract, crawl4ai_page, duckdb_batch]
      config_json:
        required: true
        type: string
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        if: inputs.source == 'tech_detect'
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install source dependency
        run: |
          case "${{ inputs.source }}" in
            overture_places) pip install --disable-pip-version-check overturemaps ;;
            crawlee_site) pip install --disable-pip-version-check 'crawlee[beautifulsoup]' ;;
            scrapling_page) pip install --disable-pip-version-check 'scrapling[fetchers]' ;;
            jobspy_jobs) pip install --disable-pip-version-check python-jobspy==1.2.0 ;;
            crawl4ai_page) pip install --disable-pip-version-check crawl4ai==0.9.3 && crawl4ai-setup ;;
            duckdb_batch) pip install --disable-pip-version-check duckdb==1.5.6 ;;
            tech_detect) (cd techdetect && go mod download) ;;
          esac
      - name: Write public config
        env:
          CONFIG_JSON: ${{ inputs.config_json }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          raw=os.environ["CONFIG_JSON"]
          if len(raw)>20000: raise SystemExit("config_json too large")
          pathlib.Path("job.json").write_text(json.dumps(json.loads(raw)),encoding="utf-8")
          PY
      - name: Run worker
        run: |
          case "${{ inputs.source }}" in
            crawlee_site|scrapling_page|jobspy_jobs|searxng_search|tech_detect|contact_extract|crawl4ai_page|duckdb_batch)
              python3 advanced_worker.py --source "${{ inputs.source }}" --config job.json --out out ;;
            *)
              python3 worker.py --source "${{ inputs.source }}" --config job.json --out out ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: public-data-worker-output
          path: out/
          retention-days: 3
