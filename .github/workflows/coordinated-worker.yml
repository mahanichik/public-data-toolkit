name: Coordinated public worker
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: coordinated-public-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Claim public job
        id: claim
        env:
          COORDINATOR_URL: ${{ secrets.COORDINATOR_URL }}
        run: python3 coordinator_client.py claim --out claim.json >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        if: steps.claim.outputs.claimed == 'true' && steps.claim.outputs.task == 'tech_detect'
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install task dependency
        if: steps.claim.outputs.claimed == 'true'
        run: |
          case "${{ steps.claim.outputs.task }}" in
            overture_places) pip install --disable-pip-version-check overturemaps ;;
            crawlee_site) pip install --disable-pip-version-check 'crawlee[beautifulsoup]' ;;
            scrapling_page) pip install --disable-pip-version-check 'scrapling[fetchers]' ;;
            jobspy_jobs) pip install --disable-pip-version-check python-jobspy==1.2.0 ;;
            crawl4ai_page) pip install --disable-pip-version-check crawl4ai==0.9.3 && crawl4ai-setup ;;
            duckdb_batch) pip install --disable-pip-version-check duckdb==1.5.6 ;;
            tech_detect) (cd techdetect && go mod tidy) ;;
          esac
      - name: Run claimed task
        if: steps.claim.outputs.claimed == 'true'
        run: |
          python3 - <<'PY'
          import json,pathlib
          claim=json.loads(pathlib.Path("claim.json").read_text())
          payload=claim["job"]["payload"]
          pathlib.Path("job.json").write_text(json.dumps(payload.get("config") or payload))
          PY
          case "${{ steps.claim.outputs.task }}" in
            crawlee_site|scrapling_page|jobspy_jobs|searxng_search|tech_detect|contact_extract|crawl4ai_page|duckdb_batch)
              python3 advanced_worker.py --source "${{ steps.claim.outputs.task }}" --config job.json --out out ;;
            *)
              python3 worker.py --source "${{ steps.claim.outputs.task }}" --config job.json --out out ;;
          esac
      - name: Return result
        if: steps.claim.outputs.claimed == 'true' && always()
        env:
          COORDINATOR_URL: ${{ secrets.COORDINATOR_URL }}
        run: |
          if [ -f out/receipt.json ]; then python3 coordinator_client.py complete --claim claim.json --result-dir out; fi
      - uses: actions/upload-artifact@v4
        if: steps.claim.outputs.claimed == 'true' && always()
        with:
          name: coordinated-public-data-output
          path: out/
          retention-days: 3
